# Phase E.22 — replace two E.21 picks: the dining photo showed wine and
# faces, the grocery photo a partial face. Unbranded, no people.

name: seed-images-e22

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e22.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Replace two photos (faces / drinks in E.21 picks)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          for slug in deal-emirates-islamic-carrefour-weekend-aed50 deal-emirates-islamic-careem-dineout-weekend-aed40; do rm -f "public/images/stock/thumb/$slug.webp" "public/images/stock/md/$slug.webp"; done
          npm run fetch:stock -- --slug "deal-emirates-islamic-carrefour-weekend-aed50" --query "fresh vegetables fruit in paper grocery bag on table" --orientation landscape --pick 1 --replace --alt "Fresh vegetables and fruit in a paper grocery bag on a table"
          npm run fetch:stock -- --slug "deal-emirates-islamic-careem-dineout-weekend-aed40" --query "top view mezze dishes hummus salad flatbread table" --orientation landscape --pick 0 --replace --alt "Top-down view of mezze dishes, salad and flatbread on a table"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.22 — replace two weekly photos (19 Oct)" \
            -m "Licensed Pexels photograph, unbranded mood imagery."
          git push origin "HEAD:$TARGET_BRANCH"
