# Phase E.19 — photos for the 13 October 2026 content round (hotel desk,
# deals desk, airline + banking news). Unbranded mood imagery only: no
# liveries, logos, faces or alcohol. Push-triggered on claude/** branches.

name: seed-images-e19

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e19.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Fetch the 13 October content-round photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          while IFS='|' read -r slug query alt; do
            [ -z "$slug" ] && continue
            echo "::group::$slug"
            npm run fetch:stock -- --slug "$slug" --query "$query" --orientation landscape --pick 0 --alt "$alt" || echo "::warning::fetch failed for $slug"
            echo "::endgroup::"
          done <<'SEEDS'
          news-world-of-hyatt-new-hotels-double-points-25000-cap|modern hotel lobby empty marble reception evening|An empty modern hotel lobby with a marble reception desk in warm evening light
          guide-best-uae-cards-hotel-points-2026|hotel room desk key card|A hotel key card on a desk in a hotel room
          deal-fab-noon-10pct-monthly|cardboard delivery boxes doorstep|Cardboard delivery boxes stacked at a front door
          deal-adib-lulu-thursdays-20pct|grocery basket fresh vegetables|A basket of fresh vegetables
          deal-emirates-islamic-etihad-guest-welcome-oct-2026|airplane wing window view clouds sunset|An aircraft wing over clouds at sunset, seen from a cabin window
          news-etihad-abu-dhabi-red-sea-twice-weekly-from-25-october|red sea coral reef turquoise water aerial|Turquoise shallows and a coral reef seen from above along a desert coastline
          news-flydubai-dubai-budapest-daily-from-25-october|Budapest Danube parliament dusk|The Danube at dusk in Budapest, with the Parliament building lit on the far bank
          news-mashreq-aura-credit-cards-launch-alshaya|shopping bags mall interior|Paper shopping bags in a softly lit shopping mall
          news-dib-consumer-cashback-grocery-school-fee-caps-cut-10-october|supermarket trolley groceries aisle|A shopping trolley of groceries in a supermarket aisle
          SEEDS

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.19 — photos for the 13 October content round" \
            -m "Licensed Pexels photograph, unbranded mood imagery."
          git push origin "HEAD:$TARGET_BRANCH"
