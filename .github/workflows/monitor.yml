# Event-driven change monitoring — reads Firecrawl monitor results and
# routes them (design: .council/research/2026-08/monitoring-design.md).
#
# Firecrawl does the watching on its own schedule. This job reads what it
# found, writes a digest, opens an issue, and — for fee-document and
# product-page changes — dispatches the EXISTING deterministic scraper for
# just the affected bank. A preview never dispatches a scrape.
#
# That last step is the point of the whole thing: instead of sweeping all
# configured banks quarterly and hoping, we scrape the one bank that actually
# changed, the day it changes. The scrape, the PR and the Chairman merge
# gate are all unchanged.
#
# What this workflow does NOT do: write any figure. Charter §6 keeps typed
# numerics on deterministic regex parsers. Monitors report that something
# moved; scripts/scrape/ decides what it now is.
#
# Offers changes are deliberately alert-only — typed editor fields
# (welcomeBonus, annualFeeWaiver, _features) are never written by the
# scraper, so those route to an editor and to the deals desk.
#
# State and digests are committed to the unprotected `automation-state`
# branch, not main: the council-signoff required check blocks every
# direct bot push to main, and no bypass exists for the Actions app
# (scripts/ci/automation-state.sh has the full story). The alert a human
# acts on is the GitHub issue, which carries the whole digest as its
# body — the branch is the archive plus dedupe state.

name: monitor

on:
  schedule:
    # 04:23 UTC — after the 03:00/04:00/05:00 monitor checks have run.
    # Off-minute per the scheduling hygiene used by news-monitor.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview dispatched ref: no issues, state save or scraper hand-off"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Feature refs are preview-only. Existing schedules/live dispatch use main.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.ref || 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # Restore state only. The poll emits exact fresh paths and this run's
      # marker; neither old history nor mtime chooses a human alert.
      - name: Restore automation state
        # restore can bootstrap a branch; a preview must never call it.
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: bash scripts/ci/automation-state.sh restore data/monitor

      - name: Read existing state for preview
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        # Unlike restore, these reads cannot bootstrap or push a state branch.
        # Use the real latest IDs/cursor, not the frozen migration seed on main.
        run: |
          git fetch origin refs/heads/automation-state
          git restore --source=FETCH_HEAD -- data/monitor

      - name: Poll monitor results
        id: poll
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          MONITOR_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/monitor/poll.mjs

      - name: Deliver alerts and acknowledge pending state
        # Health failures still reach a human. A failed delivery or required
        # bank dispatch is red and cannot advance canonical remote seen-state.
        if: always() && steps.poll.outputs.health_written == github.run_id
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          MONITOR_HEALTH_RUN: ${{ steps.poll.outputs.health_written }}
          MONITOR_STATE_RUN: ${{ steps.poll.outputs.state_written }}
          MONITOR_HEALTH_PATH: ${{ steps.poll.outputs.health_path }}
          MONITOR_STATE_PATH: ${{ steps.poll.outputs.state_path }}
          MONITOR_CARD_DIGEST: ${{ steps.poll.outputs.card_digest_path }}
          MONITOR_SALARY_DIGEST: ${{ steps.poll.outputs.salary_digest_path }}
          MONITOR_NEWS_DIGEST: ${{ steps.poll.outputs.news_digest_path }}
          MONITOR_HEALTH_DIGEST: ${{ steps.poll.outputs.health_digest_path }}
          MONITOR_BANKS: ${{ steps.poll.outputs.banks }}
        run: node scripts/ci/deliver-monitor.mjs

      - name: Retain monitor diagnostics
        if: always() && steps.poll.outputs.health_written == github.run_id
        uses: actions/upload-artifact@v4
        with:
          name: monitor-health-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            data/monitor/health.json
            data/monitor/state.pending.json
            ${{ steps.poll.outputs.card_digest_path }}
            ${{ steps.poll.outputs.salary_digest_path }}
            ${{ steps.poll.outputs.news_digest_path }}
            ${{ steps.poll.outputs.health_digest_path }}
