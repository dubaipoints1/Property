# Event-driven change monitoring — reads Firecrawl monitor results and
# routes them (design: .council/research/2026-08/monitoring-design.md).
#
# Firecrawl does the watching on its own schedule. This job reads what it
# found, writes a digest, opens an issue, and — for fee-document and
# product-page changes — dispatches the EXISTING deterministic scraper for
# just the affected bank.
#
# That last step is the point of the whole thing: instead of sweeping all
# 12 banks quarterly and hoping, we scrape the one bank that actually
# changed, the day it changes. The scrape, the PR and the Chairman merge
# gate are all unchanged.
#
# What this workflow does NOT do: write any figure. Charter §6 keeps typed
# numerics on deterministic regex parsers. Monitors report that something
# moved; scripts/scrape/ decides what it now is.
#
# Offers changes are deliberately alert-only — typed editor fields
# (welcomeBonus, annualFeeWaiver, _features) are never written by the
# scraper, so those route to an editor and to the deals desk.
#
# State and digests are committed to the unprotected `automation-state`
# branch, not main: the council-signoff required check blocks every
# direct bot push to main, and no bypass exists for the Actions app
# (scripts/ci/automation-state.sh has the full story). The alert a human
# acts on is the GitHub issue, which carries the whole digest as its
# body — the branch is the archive plus dedupe state.

name: monitor

on:
  schedule:
    # 04:23 UTC — after the 03:00/04:00/05:00 monitor checks have run.
    # Off-minute per the scheduling hygiene used by news-monitor.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # State only — NOT .council/monitoring/. The issue steps below use
      # `git status` to tell a digest written by THIS run from ones
      # already in history; restoring old digests into the working tree
      # would make every past digest look freshly written.
      - name: Restore automation state
        run: bash scripts/ci/automation-state.sh restore data/monitor

      - name: Poll monitor results
        id: poll
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/monitor/poll.mjs

      - name: Open card-change issue
        if: hashFiles('.council/monitoring/card-change-*.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(ls -t .council/monitoring/card-change-*.md | head -1)
          # only raise an issue for a digest created in this run
          if [ -n "$(git status --porcelain "$latest")" ]; then
            gh issue create \
              --title "Card change signals: $(basename "$latest" .md | sed 's/card-change-//')" \
              --body-file "$latest" \
              --label "card-change" || echo "issue creation failed (label may not exist) — digest still committed"
          fi

      - name: Open news digest issue
        if: hashFiles('.council/monitoring/digest-*.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(ls -t .council/monitoring/digest-*.md | head -1)
          if [ -n "$(git status --porcelain "$latest")" ]; then
            gh issue create \
              --title "News digest: $(basename "$latest" .md | sed 's/digest-//')" \
              --body-file "$latest" \
              --label "news-digest" || echo "issue creation failed — digest still committed"
          fi

      - name: Dispatch targeted scrape for changed banks
        if: steps.poll.outputs.banks != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuses the single-bank `bank` input already present on
          # scrape.yml — no new scraping code, no new data path.
          for BANK in ${{ steps.poll.outputs.banks }}; do
            echo "Dispatching scrape for $BANK"
            gh workflow run scrape.yml -f bank="$BANK" \
              || echo "dispatch failed for $BANK"
          done

      - name: Save digests + state to automation-state
        run: |
          bash scripts/ci/automation-state.sh save \
            "monitor: change signals ($(date -u +%Y-%m-%d\ %H:%M) UTC)" \
            .council/monitoring data/monitor
