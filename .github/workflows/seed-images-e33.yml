# Phase E.33 — real brand photos (2026-10-20 Chairman ruling): airline liveries
# and hotel-brand facades for airline and hotel pages. Picks chosen after
# viewing the Pexels candidates (pexels-candidates.yml).

name: seed-images-e33

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e33.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Replace audited photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          rm -f "public/images/stock/thumb/news-skywards-miles-expiry-birthday-month-rule-ends-2027.webp" "public/images/stock/md/news-skywards-miles-expiry-birthday-month-rule-ends-2027.webp"
          npm run fetch:stock -- --slug "news-skywards-miles-expiry-birthday-month-rule-ends-2027" --query "Emirates airline airplane" --orientation landscape --pick 0 --replace --alt "An Emirates Airbus A380 on the taxiway"
          rm -f "public/images/stock/thumb/guide-best-skywards-cards-uae-2026.webp" "public/images/stock/md/guide-best-skywards-cards-uae-2026.webp"
          npm run fetch:stock -- --slug "guide-best-skywards-cards-uae-2026" --query "Emirates airline airplane" --orientation landscape --pick 1 --replace --alt "An Emirates Boeing 777 in flight"
          rm -f "public/images/stock/thumb/news-skywards-summer-redemption-push-dss-5-million-miles.webp" "public/images/stock/md/news-skywards-summer-redemption-push-dss-5-million-miles.webp"
          npm run fetch:stock -- --slug "news-skywards-summer-redemption-push-dss-5-million-miles" --query "Emirates airline airplane" --orientation landscape --pick 2 --replace --alt "An Emirates Boeing 777 climbing after take-off"
          rm -f "public/images/stock/thumb/guide-best-uae-points-programmes-premium-cabin-2026.webp" "public/images/stock/md/guide-best-uae-points-programmes-premium-cabin-2026.webp"
          npm run fetch:stock -- --slug "guide-best-uae-points-programmes-premium-cabin-2026" --query "Emirates airline airplane" --orientation landscape --pick 3 --replace --alt "An Emirates Boeing 777 taking off"
          rm -f "public/images/stock/thumb/news-emirates-a350-premium-economy-privacy-screen-seat.webp" "public/images/stock/md/news-emirates-a350-premium-economy-privacy-screen-seat.webp"
          npm run fetch:stock -- --slug "news-emirates-a350-premium-economy-privacy-screen-seat" --query "Emirates A350" --orientation landscape --pick 1 --replace --alt "An Emirates wide-body aircraft on the apron"
          rm -f "public/images/stock/thumb/deal-etihad-fare-sale-july-2026.webp" "public/images/stock/md/deal-etihad-fare-sale-july-2026.webp"
          npm run fetch:stock -- --slug "deal-etihad-fare-sale-july-2026" --query "Etihad Airways airplane" --orientation landscape --pick 0 --replace --alt "An Etihad Airways Boeing 787 in flight"
          rm -f "public/images/stock/thumb/news-etihad-fare-sale-book-by-31-july-2026.webp" "public/images/stock/md/news-etihad-fare-sale-book-by-31-july-2026.webp"
          npm run fetch:stock -- --slug "news-etihad-fare-sale-book-by-31-july-2026" --query "Etihad Airways airplane" --orientation landscape --pick 0 --replace --alt "An Etihad Airways Boeing 787 in flight"
          rm -f "public/images/stock/thumb/news-etihad-guest-points-exchange-bonus-up-to-40-percent-31-october.webp" "public/images/stock/md/news-etihad-guest-points-exchange-bonus-up-to-40-percent-31-october.webp"
          npm run fetch:stock -- --slug "news-etihad-guest-points-exchange-bonus-up-to-40-percent-31-october" --query "Etihad Airways airplane" --orientation landscape --pick 1 --replace --alt "An Etihad Airways aircraft in a special livery"
          rm -f "public/images/stock/thumb/deal-emirates-islamic-etihad-guest-welcome-oct-2026.webp" "public/images/stock/md/deal-emirates-islamic-etihad-guest-welcome-oct-2026.webp"
          npm run fetch:stock -- --slug "deal-emirates-islamic-etihad-guest-welcome-oct-2026" --query "Etihad Airways airplane" --orientation landscape --pick 3 --replace --alt "An Etihad Airways Boeing 787 on approach"
          rm -f "public/images/stock/thumb/news-etihad-miles-rate-holds-2-94-fils-second-sale.webp" "public/images/stock/md/news-etihad-miles-rate-holds-2-94-fils-second-sale.webp"
          npm run fetch:stock -- --slug "news-etihad-miles-rate-holds-2-94-fils-second-sale" --query "Etihad Airways airplane" --orientation landscape --pick 3 --replace --alt "An Etihad Airways Boeing 787 on approach"
          rm -f "public/images/stock/thumb/news-etihad-abu-dhabi-red-sea-twice-weekly-from-25-october.webp" "public/images/stock/md/news-etihad-abu-dhabi-red-sea-twice-weekly-from-25-october.webp"
          npm run fetch:stock -- --slug "news-etihad-abu-dhabi-red-sea-twice-weekly-from-25-october" --query "Etihad Airways airplane" --orientation landscape --pick 4 --replace --alt "An Etihad Airways Boeing 787 climbing"
          rm -f "public/images/stock/thumb/news-qatar-avios-transfer-bonus-uae-banks-31-october.webp" "public/images/stock/md/news-qatar-avios-transfer-bonus-uae-banks-31-october.webp"
