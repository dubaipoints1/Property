          rm -f "public/images/stock/thumb/news-qatar-privilege-club-my-list-booking-avios-for-others.webp" "public/images/stock/md/news-qatar-privilege-club-my-list-booking-avios-for-others.webp"
          npm run fetch:stock -- --slug "news-qatar-privilege-club-my-list-booking-avios-for-others" --query "Qatar Airways airplane" --orientation landscape --pick 1 --replace --alt "A Qatar Airways Airbus A350 in flight"
          rm -f "public/images/stock/thumb/news-qatar-privilege-deals-avios-book-by-14-september.webp" "public/images/stock/md/news-qatar-privilege-deals-avios-book-by-14-september.webp"
          npm run fetch:stock -- --slug "news-qatar-privilege-deals-avios-book-by-14-september" --query "Qatar Airways airplane" --orientation landscape --pick 2 --replace --alt "A Qatar Airways aircraft on the runway"
          rm -f "public/images/stock/thumb/news-qatar-privilege-deals-october-sharjah-book-by-14-october.webp" "public/images/stock/md/news-qatar-privilege-deals-october-sharjah-book-by-14-october.webp"
          npm run fetch:stock -- --slug "news-qatar-privilege-deals-october-sharjah-book-by-14-october" --query "Qatar Airways airplane" --orientation landscape --pick 3 --replace --alt "A Qatar Airways Airbus A350 taking off"
          rm -f "public/images/stock/thumb/programme-air-arabia-airrewards.webp" "public/images/stock/md/programme-air-arabia-airrewards.webp"
          npm run fetch:stock -- --slug "programme-air-arabia-airrewards" --query "Air Arabia airplane" --orientation landscape --pick 0 --replace --alt "An Air Arabia Airbus A320 in flight"
          rm -f "public/images/stock/thumb/deal-dib-air-arabia-20pct-ultimate.webp" "public/images/stock/md/deal-dib-air-arabia-20pct-ultimate.webp"
          npm run fetch:stock -- --slug "deal-dib-air-arabia-20pct-ultimate" --query "Air Arabia airplane" --orientation landscape --pick 0 --replace --alt "An Air Arabia Airbus A320 in flight"
          rm -f "public/images/stock/thumb/news-air-arabia-ras-al-khaimah-kozhikode-daily-resumes.webp" "public/images/stock/md/news-air-arabia-ras-al-khaimah-kozhikode-daily-resumes.webp"
          npm run fetch:stock -- --slug "news-air-arabia-ras-al-khaimah-kozhikode-daily-resumes" --query "Air Arabia airplane" --orientation landscape --pick 0 --replace --alt "An Air Arabia Airbus A320 in flight"
          rm -f "public/images/stock/thumb/news-air-arabia-sharjah-amman-city-airport-four-weekly-15-november.webp" "public/images/stock/md/news-air-arabia-sharjah-amman-city-airport-four-weekly-15-november.webp"
          npm run fetch:stock -- --slug "news-air-arabia-sharjah-amman-city-airport-four-weekly-15-november" --query "Air Arabia airplane" --orientation landscape --pick 0 --replace --alt "An Air Arabia Airbus A320 in flight"
          rm -f "public/images/stock/thumb/news-emirates-nbd-new-account-air-arabia-return-ticket-31-december.webp" "public/images/stock/md/news-emirates-nbd-new-account-air-arabia-return-ticket-31-december.webp"
          npm run fetch:stock -- --slug "news-emirates-nbd-new-account-air-arabia-return-ticket-31-december" --query "Air Arabia airplane" --orientation landscape --pick 0 --replace --alt "An Air Arabia Airbus A320 in flight"
          rm -f "public/images/stock/thumb/news-flydubai-dubai-budapest-daily-from-25-october.webp" "public/images/stock/md/news-flydubai-dubai-budapest-daily-from-25-october.webp"
          npm run fetch:stock -- --slug "news-flydubai-dubai-budapest-daily-from-25-october" --query "flydubai airplane" --orientation landscape --pick 1 --replace --alt "A flydubai Boeing 737 climbing"
          rm -f "public/images/stock/thumb/news-flydubai-dubai-pokhara-daily-from-23-september.webp" "public/images/stock/md/news-flydubai-dubai-pokhara-daily-from-23-september.webp"
          npm run fetch:stock -- --slug "news-flydubai-dubai-pokhara-daily-from-23-september" --query "flydubai airplane" --orientation landscape --pick 2 --replace --alt "A flydubai Boeing 737 in flight"
          rm -f "public/images/stock/thumb/news-flydubai-interline-air-india-uzbekistan-airways.webp" "public/images/stock/md/news-flydubai-interline-air-india-uzbekistan-airways.webp"
          npm run fetch:stock -- --slug "news-flydubai-interline-air-india-uzbekistan-airways" --query "flydubai airplane" --orientation landscape --pick 0 --replace --alt "A flydubai Boeing 737 taking off"
          rm -f "public/images/stock/thumb/programme-saudia-alfursan.webp" "public/images/stock/md/programme-saudia-alfursan.webp"
          npm run fetch:stock -- --slug "programme-saudia-alfursan" --query "Saudia airlines airplane" --orientation landscape --pick 0 --replace --alt "A Saudia Boeing 777 in flight"
          rm -f "public/images/stock/thumb/programme-marriott-bonvoy.webp" "public/images/stock/md/programme-marriott-bonvoy.webp"
          npm run fetch:stock -- --slug "programme-marriott-bonvoy" --query "Marriott hotel" --orientation landscape --pick 1 --replace --alt "A Marriott hotel building"
          rm -f "public/images/stock/thumb/news-marriott-bonvoy-skywards-5000-points-one-stay.webp" "public/images/stock/md/news-marriott-bonvoy-skywards-5000-points-one-stay.webp"
          npm run fetch:stock -- --slug "news-marriott-bonvoy-skywards-5000-points-one-stay" --query "Marriott hotel" --orientation landscape --pick 1 --replace --alt "A Marriott hotel building"
          rm -f "public/images/stock/thumb/news-marriott-bonvoy-upgrade-list-app-beta-not-yet-uae.webp" "public/images/stock/md/news-marriott-bonvoy-upgrade-list-app-beta-not-yet-uae.webp"
          npm run fetch:stock -- --slug "news-marriott-bonvoy-upgrade-list-app-beta-not-yet-uae" --query "Marriott hotel" --orientation landscape --pick 1 --replace --alt "A Marriott hotel building"
          rm -f "public/images/stock/thumb/news-adib-marriott-bonvoy-cards-launch-uae.webp" "public/images/stock/md/news-adib-marriott-bonvoy-cards-launch-uae.webp"
          npm run fetch:stock -- --slug "news-adib-marriott-bonvoy-cards-launch-uae" --query "Marriott hotel" --orientation landscape --pick 1 --replace --alt "A Marriott hotel building"
          rm -f "public/images/stock/thumb/programme-hilton-honors.webp" "public/images/stock/md/programme-hilton-honors.webp"
          npm run fetch:stock -- --slug "programme-hilton-honors" --query "Hilton hotel" --orientation landscape --pick 1 --replace --alt "The facade of a Hilton hotel"
          rm -f "public/images/stock/thumb/news-hilton-honors-more-points-to-play-uae-hotels-31-december.webp" "public/images/stock/md/news-hilton-honors-more-points-to-play-uae-hotels-31-december.webp"
          npm run fetch:stock -- --slug "news-hilton-honors-more-points-to-play-uae-hotels-31-december" --query "Hilton hotel" --orientation landscape --pick 4 --replace --alt "A Hilton hotel on the beachfront"
          rm -f "public/images/stock/thumb/programme-world-of-hyatt.webp" "public/images/stock/md/programme-world-of-hyatt.webp"
          npm run fetch:stock -- --slug "programme-world-of-hyatt" --query "Hyatt hotel" --orientation landscape --pick 1 --replace --alt "A Hyatt Regency hotel facade"
          rm -f "public/images/stock/thumb/news-world-of-hyatt-3000-bonus-points-every-three-nights-15-december.webp" "public/images/stock/md/news-world-of-hyatt-3000-bonus-points-every-three-nights-15-december.webp"
          npm run fetch:stock -- --slug "news-world-of-hyatt-3000-bonus-points-every-three-nights-15-december" --query "Hyatt hotel" --orientation landscape --pick 2 --replace --alt "A Hyatt hotel tower"
          rm -f "public/images/stock/thumb/news-world-of-hyatt-new-hotels-double-points-25000-cap.webp" "public/images/stock/md/news-world-of-hyatt-new-hotels-double-points-25000-cap.webp"
          npm run fetch:stock -- --slug "news-world-of-hyatt-new-hotels-double-points-25000-cap" --query "Hyatt hotel" --orientation landscape --pick 0 --replace --alt "A Hyatt hotel tower above parkland"
          rm -f "public/images/stock/thumb/programme-accor-all.webp" "public/images/stock/md/programme-accor-all.webp"
          npm run fetch:stock -- --slug "programme-accor-all" --query "Sofitel hotel" --orientation landscape --pick 2 --replace --alt "A Sofitel hotel facade"
          rm -f "public/images/stock/thumb/news-all-accor-triple-points-uae-hotels-book-by-25-october.webp" "public/images/stock/md/news-all-accor-triple-points-uae-hotels-book-by-25-october.webp"
          npm run fetch:stock -- --slug "news-all-accor-triple-points-uae-hotels-book-by-25-october" --query "Novotel hotel" --orientation landscape --pick 0 --replace --alt "A Novotel hotel facade"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.33 — real airline and hotel brand photos" \
            -m "Licensed Pexels photographs of the brands the pages cover."
          git push origin "HEAD:$TARGET_BRANCH"
