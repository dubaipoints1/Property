# Phase E.46 — Qatar Airways livery for the November Privilege Deals post (candidate viewed before pick; not used elsewhere). No faces, no alcohol.

name: seed-images-e46

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e46.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Fetch photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npm run fetch:stock -- --slug "news-qatar-privilege-deals-november-colombo-manila-book-by-14-november" --query "Qatar Airways A350" --orientation landscape --pick 1 --alt "A Qatar Airways Airbus A350 in the airline's livery on the runway"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.46 — Qatar Airways A350 for the November Privilege Deals post" \
            -m "Licensed Pexels photographs naming the brands the pages cover."
          git push origin "HEAD:$TARGET_BRANCH"
