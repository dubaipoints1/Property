# Phase E.34 — IHG pages get a real InterContinental photo (2026-10-20 ruling).

name: seed-images-e34

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e34.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Replace audited photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          rm -f "public/images/stock/thumb/programme-ihg-one-rewards.webp" "public/images/stock/md/programme-ihg-one-rewards.webp"
          npm run fetch:stock -- --slug "programme-ihg-one-rewards" --query "InterContinental hotel building sign" --orientation landscape --pick 0 --replace --alt "The entrance canopy of an InterContinental hotel"
          rm -f "public/images/stock/thumb/news-ihg-one-rewards-choice-points-promo-ends-31-august.webp" "public/images/stock/md/news-ihg-one-rewards-choice-points-promo-ends-31-august.webp"
          npm run fetch:stock -- --slug "news-ihg-one-rewards-choice-points-promo-ends-31-august" --query "InterContinental hotel building sign" --orientation landscape --pick 1 --replace --alt "An InterContinental hotel building with its sign"
          rm -f "public/images/stock/thumb/news-ihg-garner-hotels-uae-dubai-al-jaddaf-ras-al-khaimah.webp" "public/images/stock/md/news-ihg-garner-hotels-uae-dubai-al-jaddaf-ras-al-khaimah.webp"
          npm run fetch:stock -- --slug "news-ihg-garner-hotels-uae-dubai-al-jaddaf-ras-al-khaimah" --query "InterContinental hotel building sign" --orientation landscape --pick 1 --replace --alt "An InterContinental hotel building with its sign"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.34 — InterContinental photos for IHG pages" \
            -m "Licensed Pexels photographs of the brands the pages cover."
          git push origin "HEAD:$TARGET_BRANCH"
