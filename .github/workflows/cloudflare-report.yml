name: Private Cloudflare report

# Manual operational report, not a PR gate. Tests run in the existing
# push-triggered PR checks workflow. Never run a secret-bearing branch build.
on:
  workflow_dispatch:
    inputs:
      recipient_public_key:
        description: Fresh RSA public SPKI DER key in base64; never a private key
        required: true
        type: string

permissions:
  contents: read

jobs:
  report:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'dubaipoints1/Property'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
      - name: Read and encrypt Cloudflare report
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          # Account from the existing Pages check link; collector must verify
          # an exact, unambiguous dubaipoints.ae custom-domain match.
          CLOUDFLARE_ACCOUNT_ID: f0b783a15a8912b2583e4dc36b60c994
          REPORT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          REPORT_OUTPUT: ${{ runner.temp }}/cloudflare-report.enc.json
        run: node scripts/cloudflare/report.mjs
      - name: Retain encrypted report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-report-encrypted
          path: ${{ runner.temp }}/cloudflare-report.enc.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
