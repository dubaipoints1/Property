# News-desk RSS discovery — twice-daily sweep for the airline and hotel
# news desks (council session 2026-07-27-travel-news-desks-strategy;
# sourcing ladder in .council/research/2026-07/news-sourcing-policy.md).
#
# Runs in Actions because the aggregator hosts are unreachable from
# Claude Code web-session egress. Commits the digest + state to the
# unprotected `automation-state` branch — main's required council-signoff
# check blocks direct bot pushes (see scripts/ci/automation-state.sh).
# The issue opened below carries the full digest, so the desks lose
# nothing. Digests are not part of the site build.
#
# Free to run as of 2026-08: the press-room tier moved to native
# Firecrawl monitors (.github/workflows/monitor.yml), so this job needs
# no Firecrawl key. Feed metadata remains discovered/unread/not verified;
# subsequent secondary reporting follows the 27 September attribution ruling.

name: news-monitor

on:
  schedule:
    # 05:07 and 13:07 UTC — 09:07 and 17:07 UAE time (off-minute per
    # scheduling hygiene; catches overnight US-blog posts and the
    # Gulf-morning press drops).
    - cron: "7 5,13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview dispatched ref only: no issue, state save or publication"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: news-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Feature refs are preview-only. Live dispatch and schedules use main.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.ref || 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # State only — this run emits its own fresh digest path and marker.
      - name: Restore automation state
        # restore can bootstrap the state branch: never call it in a preview.
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: bash scripts/ci/automation-state.sh restore data/news-monitor

      - name: Run RSS discovery sweep
        id: discovery
        env:
          NEWS_MONITOR_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/news-monitor/monitor.mjs

      - name: Open digest issue
        id: delivery
        if: always() && steps.discovery.outputs.health_written == github.run_id && steps.discovery.outputs.digest_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_PATH: ${{ steps.discovery.outputs.digest_path }}
        run: |
          # Only this run's fixed-format output path, including on failure.
          # Never select an older digest by mtime.
          [[ "$DIGEST_PATH" =~ ^\.council/monitoring/digest-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}\.md$ ]]
          test -f "$DIGEST_PATH"
          bash scripts/ci/post-digest.sh news-digest \
            "News digest: $(basename "$DIGEST_PATH" .md | sed 's/digest-//')" "$DIGEST_PATH"

      - name: Retain discovery diagnostics
        if: always() && steps.discovery.outputs.health_written == github.run_id
        uses: actions/upload-artifact@v4
        with:
          name: news-discovery-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            data/news-monitor/latest-health.json
            data/news-monitor/latest-triage.json
            ${{ steps.discovery.outputs.digest_path }}

      - name: Save digest + state to automation-state
        # Local candidate state is acknowledged only after required delivery.
        # Failed delivery leaves canonical seen AND prior health unchanged, so
        # the next sweep retries the human alert. Fresh artifacts still survive.
        if: always() && steps.discovery.outputs.health_written == github.run_id && steps.discovery.outputs.state_written == github.run_id && (steps.discovery.outputs.digest_path == '' || steps.delivery.outcome == 'success')
        run: |
          bash scripts/ci/automation-state.sh save \
            "monitor: news discovery digest ($(date -u +%Y-%m-%d\ %H:%M) UTC)" \
            .council/monitoring data/news-monitor
