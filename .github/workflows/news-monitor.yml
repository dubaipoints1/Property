# News-desk RSS discovery — twice-daily sweep for the airline and hotel
# news desks (council session 2026-07-27-travel-news-desks-strategy;
# sourcing ladder in .council/research/2026-07/news-sourcing-policy.md).
#
# Runs in Actions because the aggregator hosts are unreachable from
# Claude Code web-session egress. Commits the digest + state straight to
# main (same precedent as scrape.yml's LATEST_RUN.log). Digests live
# under .council/monitoring/ and are not part of the site build.
#
# Free to run as of 2026-08: the press-room tier moved to native
# Firecrawl monitors (.github/workflows/monitor.yml), so this job needs
# no Firecrawl key and has no credit cap. RSS remains discovery-only per
# the sourcing ladder.

name: news-monitor

on:
  schedule:
    # 05:07 and 13:07 UTC — 09:07 and 17:07 UAE time (off-minute per
    # scheduling hygiene; catches overnight US-blog posts and the
    # Gulf-morning press drops).
    - cron: "7 5,13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: news-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Run RSS discovery sweep
        run: node scripts/news-monitor/monitor.mjs

      - name: Open digest issue
        if: hashFiles('.council/monitoring/digest-*.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(ls -t .council/monitoring/digest-*.md | head -1)
          # only raise an issue for a digest created in this run
          if [ -n "$(git status --porcelain "$latest")" ]; then
            gh issue create \
              --title "News digest: $(basename "$latest" .md | sed 's/digest-//')" \
              --body-file "$latest" \
              --label "news-digest" || echo "issue creation failed (label may not exist) — digest still committed"
          fi

      - name: Commit digest + state
        run: |
          git config user.name "dubaipoints-news-monitor"
          git config user.email "info@dubaipoints.ae"
          git add .council/monitoring/ data/news-monitor/ || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "monitor: news discovery digest ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            git push origin main
          fi
