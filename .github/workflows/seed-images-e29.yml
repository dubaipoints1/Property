# Phase E.29 — site-wide photo audit (20 Oct 2026): replace photos showing
# faces, airline liveries or brand logos. Unbranded, no people.

name: seed-images-e29

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e29.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Replace audited photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          rm -f "public/images/stock/thumb/card-adcb-lulu-platinum.webp" "public/images/stock/md/card-adcb-lulu-platinum.webp"
          npm run fetch:stock -- --slug "card-adcb-lulu-platinum" --query "fresh produce supermarket shelves empty aisle" --orientation landscape --pick 0 --replace --alt "Fresh fruit and vegetables on supermarket shelves"
          rm -f "public/images/stock/thumb/card-adcb-traveller.webp" "public/images/stock/md/card-adcb-traveller.webp"
          npm run fetch:stock -- --slug "card-adcb-traveller" --query "suitcase hotel corridor" --orientation landscape --pick 0 --replace --alt "A suitcase standing in a hotel corridor"
          rm -f "public/images/stock/thumb/card-cbd-one.webp" "public/images/stock/md/card-cbd-one.webp"
          npm run fetch:stock -- --slug "card-cbd-one" --query "laptop coffee cup bed morning" --orientation landscape --pick 0 --replace --alt "A laptop and a cup of coffee on a bed in morning light"
          rm -f "public/images/stock/thumb/card-fab-cashback.webp" "public/images/stock/md/card-fab-cashback.webp"
          npm run fetch:stock -- --slug "card-fab-cashback" --query "shopping bags mall floor" --orientation landscape --pick 0 --replace --alt "Shopping bags resting on a polished mall floor"
          rm -f "public/images/stock/thumb/card-hsbc-live-plus.webp" "public/images/stock/md/card-hsbc-live-plus.webp"
          npm run fetch:stock -- --slug "card-hsbc-live-plus" --query "restaurant table food plates overhead" --orientation landscape --pick 0 --replace --alt "Plates of food on a restaurant table, seen from above"
          rm -f "public/images/stock/thumb/guide-uae-credit-card-eligibility-2026.webp" "public/images/stock/md/guide-uae-credit-card-eligibility-2026.webp"
          npm run fetch:stock -- --slug "guide-uae-credit-card-eligibility-2026" --query "documents pen desk paperwork" --orientation landscape --pick 0 --replace --alt "Paperwork and a pen on an office desk"
          rm -f "public/images/stock/thumb/news-emirates-a350-premium-economy-privacy-screen-seat.webp" "public/images/stock/md/news-emirates-a350-premium-economy-privacy-screen-seat.webp"
          npm run fetch:stock -- --slug "news-emirates-a350-premium-economy-privacy-screen-seat" --query "empty airplane cabin seats" --orientation landscape --pick 0 --replace --alt "Rows of empty seats in an aircraft cabin"
          rm -f "public/images/stock/thumb/news-mashreq-cashback-category-rate-cut-13-june-2026.webp" "public/images/stock/md/news-mashreq-cashback-category-rate-cut-13-june-2026.webp"
          npm run fetch:stock -- --slug "news-mashreq-cashback-category-rate-cut-13-june-2026" --query "supermarket receipt" --orientation landscape --pick 0 --replace --alt "A supermarket receipt on a counter"
          rm -f "public/images/stock/thumb/guide-best-entry-level-cards-2026.webp" "public/images/stock/md/guide-best-entry-level-cards-2026.webp"
          npm run fetch:stock -- --slug "guide-best-entry-level-cards-2026" --query "wallet cards table" --orientation landscape --pick 0 --replace --alt "A wallet with cards on a table"
          rm -f "public/images/stock/thumb/guide-best-fuel-cards-uae-2026.webp" "public/images/stock/md/guide-best-fuel-cards-uae-2026.webp"
          npm run fetch:stock -- --slug "guide-best-fuel-cards-uae-2026" --query "fuel pump nozzle close up" --orientation landscape --pick 0 --replace --alt "A fuel pump nozzle in close-up"
          rm -f "public/images/stock/thumb/card-emirates-nbd-etihad-guest-inspire.webp" "public/images/stock/md/card-emirates-nbd-etihad-guest-inspire.webp"
          npm run fetch:stock -- --slug "card-emirates-nbd-etihad-guest-inspire" --query "airplane wing clouds window" --orientation landscape --pick 0 --replace --alt "An aircraft wing above the clouds"
          rm -f "public/images/stock/thumb/card-emirates-nbd-skywards-infinite.webp" "public/images/stock/md/card-emirates-nbd-skywards-infinite.webp"
          npm run fetch:stock -- --slug "card-emirates-nbd-skywards-infinite" --query "airplane window view clouds sunset" --orientation landscape --pick 0 --replace --alt "The view from an aircraft window at sunset"
          rm -f "public/images/stock/thumb/card-emirates-nbd-skywards-signature.webp" "public/images/stock/md/card-emirates-nbd-skywards-signature.webp"
          npm run fetch:stock -- --slug "card-emirates-nbd-skywards-signature" --query "airport terminal window aircraft silhouette" --orientation landscape --pick 0 --replace --alt "An airport terminal window at dusk"
          rm -f "public/images/stock/thumb/card-fab-etihad-guest-infinite.webp" "public/images/stock/md/card-fab-etihad-guest-infinite.webp"
          npm run fetch:stock -- --slug "card-fab-etihad-guest-infinite" --query "airplane wing sky" --orientation landscape --pick 0 --replace --alt "An aircraft wing against a clear sky"
          rm -f "public/images/stock/thumb/deal-enbd-skywards-welcome-q2-2026.webp" "public/images/stock/md/deal-enbd-skywards-welcome-q2-2026.webp"
          npm run fetch:stock -- --slug "deal-enbd-skywards-welcome-q2-2026" --query "airport departure lounge empty" --orientation landscape --pick 0 --replace --alt "An empty airport departure lounge"
          rm -f "public/images/stock/thumb/deal-etihad-last-chance-summer-2026.webp" "public/images/stock/md/deal-etihad-last-chance-summer-2026.webp"
          npm run fetch:stock -- --slug "deal-etihad-last-chance-summer-2026" --query "beach palm trees summer" --orientation landscape --pick 0 --replace --alt "A palm-lined beach on a summer day"
          rm -f "public/images/stock/thumb/guide-skywards-business-class-redemptions-2026.webp" "public/images/stock/md/guide-skywards-business-class-redemptions-2026.webp"
          npm run fetch:stock -- --slug "guide-skywards-business-class-redemptions-2026" --query "business class seat airplane" --orientation landscape --pick 0 --replace --alt "A lie-flat business-class seat"
          rm -f "public/images/stock/thumb/news-emirates-skywards-season-of-rewards-2026.webp" "public/images/stock/md/news-emirates-skywards-season-of-rewards-2026.webp"
          npm run fetch:stock -- --slug "news-emirates-skywards-season-of-rewards-2026" --query "airport runway sunset" --orientation landscape --pick 0 --replace --alt "An airport runway at sunset"
          rm -f "public/images/stock/thumb/news-skywards-season-of-rewards-final-week-31-august.webp" "public/images/stock/md/news-skywards-season-of-rewards-final-week-31-august.webp"
          npm run fetch:stock -- --slug "news-skywards-season-of-rewards-final-week-31-august" --query "airport runway lights night" --orientation landscape --pick 0 --replace --alt "Runway lights at night"
          rm -f "public/images/stock/thumb/programme-etihad-guest.webp" "public/images/stock/md/programme-etihad-guest.webp"
          npm run fetch:stock -- --slug "programme-etihad-guest" --query "abu dhabi skyline" --orientation landscape --pick 0 --replace --alt "The Abu Dhabi skyline"
          rm -f "public/images/stock/thumb/programme-qatar-privilege-club.webp" "public/images/stock/md/programme-qatar-privilege-club.webp"
          npm run fetch:stock -- --slug "programme-qatar-privilege-club" --query "doha skyline" --orientation landscape --pick 0 --replace --alt "The Doha skyline"
          rm -f "public/images/stock/thumb/programme-skywards.webp" "public/images/stock/md/programme-skywards.webp"
          npm run fetch:stock -- --slug "programme-skywards" --query "dubai skyline aerial" --orientation landscape --pick 0 --replace --alt "An aerial view of the Dubai skyline"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.29 — replace photos with faces, liveries or logos" \
            -m "Licensed Pexels photograph, unbranded mood imagery."
          git push origin "HEAD:$TARGET_BRANCH"
