# Phase E.28 — photos for the grocery, fuel, dining and no-annual-fee card
# guides. Unbranded, no people, no alcohol, no logos.

name: seed-images-e28

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e28.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Fetch four guide photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npm run fetch:stock -- --slug "guide-best-grocery-cards-uae-2026" --query "fresh produce crates market stall vegetables" --orientation landscape --pick 0 --alt "Crates of fresh vegetables and fruit on a market stall"
          npm run fetch:stock -- --slug "guide-best-fuel-cards-uae-2026" --query "empty petrol station canopy night" --orientation landscape --pick 0 --alt "An empty petrol station forecourt lit up at night"
          npm run fetch:stock -- --slug "guide-best-dining-cards-uae-2026" --query "restaurant table plates food overhead no people" --orientation landscape --pick 0 --alt "Plates of food laid out on a restaurant table, seen from above"
          npm run fetch:stock -- --slug "guide-best-no-annual-fee-cards-uae-2026" --query "wallet coins desk minimal" --orientation landscape --pick 0 --alt "A leather wallet and a few coins on a plain desk"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.28 — four card-category guides" \
            -m "Licensed Pexels photograph, unbranded mood imagery."
          git push origin "HEAD:$TARGET_BRANCH"
