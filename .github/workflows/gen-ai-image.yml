# One-off AI illustration — enabler for the 2026-07-29 Charter amendment.
#
# Sibling of refetch-image.yml. Runs `npm run gen:ai` (fal.ai) against a
# single slug and commits the result to the chosen branch.
#
# WHY A WORKFLOW RATHER THAN A LOCAL RUN: the Claude Code web session
# cannot reach fal.run — it returns 000 (no resolve), the same
# allowlist class as api.pexels.com, which is why every Pexels seed has
# gone through Actions too. GitHub's runners use different egress and
# are unaffected. A workstation with FAL_KEY in .env also works.
#
# Prereq: FAL_KEY repo secret (Settings → Secrets → Actions).
#
# How to use:
#   1. Actions tab → gen-ai-image → Run workflow
#   2. Branch: the feature branch to commit to
#   3. Slug: NEW manifest slug, kebab-case (e.g. guide-fx-concept)
#   4. Prompt: the full generating prompt — this is recorded verbatim
#      in the manifest as the image's provenance record, so write it
#      as something a reader could use to reconstruct the picture
#   5. Alt: descriptive alt text
#   6. Run, then REVIEW THE RENDERED PAGE before merging.
#
# PLAN BEFORE YOU DISPATCH. Each run costs a fal.ai credit. The first
# real image took four dispatches because the brief described the
# concept and not the composition, and because a model problem was
# re-worded twice instead of being switched. Write the six-field brief
# in .council/sops/ai-illustration-art-direction.md §2 first, check it
# against §3 and §4, then run once. Two failures on one slot means
# changing a structural variable, never re-rolling the same prompt.
#
# ── What this will refuse ───────────────────────────────────────────
# Per the amendment, AI imagery illustrates and never documents. The
# script's subject guard rejects prompts naming a real issuer, carrier,
# hotel brand, card face, document, person or brand mark, and the job
# fails with the reason. That guard is a tripwire for obvious cases,
# not a substitute for the editor's eye: an image that could be
# mistaken for evidence is a §10 kill whether or not the regex fired.
#
# Review the result for the same things the Pexels seeds are reviewed
# for — no alcohol, no religious architecture as product imagery,
# legible at tile size — plus the one that is specific to AI: does
# anything in this frame look like a record of a real thing?

name: gen-ai-image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to commit to"
        required: true
        default: "claude/session-handoff-june-10-9ufa50"
        type: string
      slug:
        description: "Manifest slug, kebab-case (e.g. guide-fx-concept)"
        required: true
        type: string
      prompt:
        description: "Full generating prompt — recorded verbatim as provenance"
        required: true
        type: string
      alt:
        description: "Descriptive alt text"
        required: true
        type: string
      model:
        description: "fal.ai model (recraft-v3 matches the house register)"
        required: false
        default: "fal-ai/recraft-v3"
        type: string
      size:
        description: "Image size preset"
        required: false
        default: "landscape_16_9"
        type: choice
        options:
          - landscape_16_9
          - landscape_4_3
          - square_hd
          - portrait_4_3
      replace:
        description: "Overwrite an existing slug"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Inputs go through env, never interpolated into the shell —
      # prompts are free text and will contain quotes and commas.
      - name: Generate illustration
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          SLUG: ${{ inputs.slug }}
          PROMPT: ${{ inputs.prompt }}
          ALT: ${{ inputs.alt }}
          MODEL: ${{ inputs.model }}
          SIZE: ${{ inputs.size }}
          REPLACE: ${{ inputs.replace }}
        run: |
          if [ -z "$FAL_KEY" ]; then
            echo "::error::FAL_KEY secret is not set. Settings → Secrets → Actions → FAL_KEY."
            exit 1
          fi
          ARGS=(--slug "$SLUG" --prompt "$PROMPT" --alt "$ALT" --model "$MODEL" --size "$SIZE")
          if [ "$REPLACE" = "true" ]; then ARGS+=(--replace); fi
          npm run gen:ai -- "${ARGS[@]}"

      - name: Validate
        run: |
          npm run check
          npm test

      - name: Commit and push
        env:
          SLUG: ${{ inputs.slug }}
          PROMPT: ${{ inputs.prompt }}
          MODEL: ${{ inputs.model }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock/manifest.json "public/images/ai/$SLUG.jpg"
          if git diff --staged --quiet; then
            echo "No change to commit (slug already seeded? pass replace: true)."
            exit 0
          fi
          git commit \
            -m "feat(images): AI illustration for $SLUG" \
            -m "Generated with $MODEL via .github/workflows/gen-ai-image.yml. Prompt recorded in the manifest as the provenance record; renders the \"not a photograph\" label per the 2026-07-29 Charter amendment." \
            -m "Prompt: $PROMPT"
          git push origin HEAD:${{ inputs.branch }}
