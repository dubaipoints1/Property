# Phase E.21 — photos for the weekly update of 19 October 2026 (three news
# posts, three Emirates Islamic deals). Unbranded mood imagery only.

name: seed-images-e21

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e21.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Fetch photos for the week of 19 October
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npm run fetch:stock -- --slug "news-air-arabia-sharjah-amman-city-airport-four-weekly-15-november" --query "Amman city hillside houses skyline daylight" --orientation landscape --pick 0 --alt "Pale stone houses stacked across the hills of Amman under a clear sky"
          npm run fetch:stock -- --slug "news-all-accor-triple-points-uae-hotels-book-by-25-october" --query "empty hotel room bed window city view evening" --orientation landscape --pick 0 --alt "A made-up hotel bed beside a window looking out over city lights in the evening"
          npm run fetch:stock -- --slug "news-marriott-bonvoy-upgrade-list-app-beta-not-yet-uae" --query "hotel suite empty sofa living area modern interior" --orientation landscape --pick 0 --alt "The empty living area of a modern hotel suite with a sofa and soft daylight"
          npm run fetch:stock -- --slug "deal-emirates-islamic-carrefour-weekend-aed50" --query "grocery delivery bags fresh vegetables kitchen counter" --orientation landscape --pick 0 --alt "Paper grocery bags of fresh vegetables and pantry staples on a kitchen counter"
          npm run fetch:stock -- --slug "deal-emirates-islamic-careem-dineout-weekend-aed40" --query "restaurant table shared plates evening dining" --orientation landscape --pick 0 --alt "Shared plates of food on a restaurant table in warm evening light"
          npm run fetch:stock -- --slug "deal-emirates-islamic-switch-cashback-welcome-aed500" --query "contactless card payment terminal hand" --orientation landscape --pick 0 --alt "A hand tapping an unbranded card on a contactless payment terminal"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.21 — weekly update photos (19 Oct)" \
            -m "Licensed Pexels photograph, unbranded mood imagery."
          git push origin "HEAD:$TARGET_BRANCH"
