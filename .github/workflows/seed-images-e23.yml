# Phase E.23 — photos for the Hilton More Points to Play post and the new
# World of Hyatt / IHG One Rewards programme pages. Unbranded, no people.

name: seed-images-e23

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e23.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Fetch photos (Hilton post, Hyatt and IHG programme pages)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npm run fetch:stock -- --slug "news-hilton-honors-more-points-to-play-uae-hotels-31-december" --query "hotel pool sunset empty loungers" --orientation landscape --pick 0 --alt "Empty sun loungers beside a hotel swimming pool at sunset"
          npm run fetch:stock -- --slug "programme-world-of-hyatt" --query "resort pool loungers palm trees morning no people" --orientation landscape --pick 0 --alt "An empty resort pool lined with sun loungers and palm trees in morning light"
          npm run fetch:stock -- --slug "programme-ihg-one-rewards" --query "hotel room desk window city view interior" --orientation landscape --pick 0 --alt "A tidy hotel room with a work desk by a city-view window"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.23 — Hilton post and Hyatt/IHG programme photos" \
            -m "Licensed Pexels photograph, unbranded mood imagery."
          git push origin "HEAD:$TARGET_BRANCH"
