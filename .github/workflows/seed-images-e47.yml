# Phase E.47 — photos for the 10 November news round: flydubai livery, Accor brands (Sofitel, Novotel), an Emirates 777 and a Dubai skyline for the IHG post (no usable IHG-brand photo among the candidates). Every candidate viewed before pick; none used elsewhere. No faces, no alcohol.

name: seed-images-e47

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e47.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Fetch photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npm run fetch:stock -- --slug "news-flydubai-riga-salzburg-vilnius-from-december-2026" --query "flydubai airplane" --orientation landscape --pick 1 --alt "A flydubai Boeing 737 in the airline's livery in flight"
          npm run fetch:stock -- --slug "news-all-accor-hotel-sale-uae-15-percent-prepaid-book-by-1-december" --query "Sofitel hotel" --orientation landscape --pick 0 --alt "A Sofitel hotel tower behind a city square"
          npm run fetch:stock -- --slug "news-qatar-avios-to-all-accor-points-3-5-to-1-worth-it" --query "Novotel hotel" --orientation landscape --pick 4 --alt "A Novotel hotel on a riverbank in morning haze"
          npm run fetch:stock -- --slug "news-ihg-one-rewards-triple-points-app-second-stay-31-december" --query "InterContinental hotel" --orientation landscape --pick 2 --alt "Green glass towers on the Dubai skyline"
          npm run fetch:stock -- --slug "news-emirates-skywards-bonus-tier-miles-now-up-to-20-percent" --query "Emirates Boeing 777" --orientation landscape --pick 0 --alt "An Emirates Boeing 777 in the airline's livery on approach"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.47 — photos for the 10 November news round" \
            -m "Licensed Pexels photographs naming the brands the pages cover."
          git push origin "HEAD:$TARGET_BRANCH"
