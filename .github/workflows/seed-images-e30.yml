# Phase E.30 — second pass on four E.29 picks (a repeat face, a laptop logo,
# luggage instead of shopping bags, an old airline livery). Unbranded, no people.

name: seed-images-e30

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e30.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Replace audited photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          rm -f "public/images/stock/thumb/card-adcb-traveller.webp" "public/images/stock/md/card-adcb-traveller.webp"
          npm run fetch:stock -- --slug "card-adcb-traveller" --query "travel suitcase passport flat lay" --orientation landscape --pick 1 --replace --alt "A suitcase and a passport laid out for a trip"
          rm -f "public/images/stock/thumb/card-cbd-one.webp" "public/images/stock/md/card-cbd-one.webp"
          npm run fetch:stock -- --slug "card-cbd-one" --query "living room sofa television evening" --orientation landscape --pick 0 --replace --alt "A living room sofa facing a television in the evening"
          rm -f "public/images/stock/thumb/card-fab-cashback.webp" "public/images/stock/md/card-fab-cashback.webp"
          npm run fetch:stock -- --slug "card-fab-cashback" --query "paper shopping bags" --orientation landscape --pick 1 --replace --alt "Paper shopping bags"
          rm -f "public/images/stock/thumb/card-fab-etihad-guest-infinite.webp" "public/images/stock/md/card-fab-etihad-guest-infinite.webp"
          npm run fetch:stock -- --slug "card-fab-etihad-guest-infinite" --query "airplane wing above clouds sunrise" --orientation landscape --pick 1 --replace --alt "An aircraft wing above the clouds at sunrise"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.30 — second pass on four photos" \
            -m "Licensed Pexels photograph, unbranded mood imagery."
          git push origin "HEAD:$TARGET_BRANCH"
