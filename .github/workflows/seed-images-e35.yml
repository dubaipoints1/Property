# Phase E.35 — photos for the 26 October 2026 news run: the real brand in each (2026-10-20 ruling).

name: seed-images-e35

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e35.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Fetch news photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npm run fetch:stock -- --slug "news-emirates-skywards-mile-a-minute-dubai-book-by-5-november" --query "Emirates airline airplane" --orientation landscape --pick 4 --alt "An Emirates aircraft in the airline's livery"
          npm run fetch:stock -- --slug "news-qatar-airways-a321lr-business-suites-qsuite-next-gen-2027" --query "Qatar Airways airplane" --orientation landscape --pick 4 --alt "A Qatar Airways aircraft in the airline's livery"
          npm run fetch:stock -- --slug "news-hilton-honors-buy-points-120-percent-bonus-21-november" --query "Hilton hotel" --orientation landscape --pick 0 --alt "A Hilton hotel building with its sign"
          npm run fetch:stock -- --slug "news-marriott-bonvoy-4500-bonus-points-register-by-13-november" --query "Marriott hotel" --orientation landscape --pick 0 --alt "A Marriott hotel building with its sign"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.35 — brand photos for the 26 October news posts" \
            -m "Licensed Pexels photographs of the brands the pages cover."
          git push origin "HEAD:$TARGET_BRANCH"
