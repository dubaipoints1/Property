# Phase E.45 — re-picks after viewing E.44: the Air Arabia deal showed a Saudia aircraft, the Emirates Holidays photo repeated another page, and the noon and Sharaf DG scenes were weak. No faces, no alcohol, no third-party brands.

name: seed-images-e45

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e45.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Fetch photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npm run fetch:stock -- --slug "deal-emirates-islamic-air-arabia-eib-book-by-15-november" --query "Air Arabia airplane" --orientation landscape --pick 0 --replace --alt "An Air Arabia Airbus in the airline's livery in flight"
          npm run fetch:stock -- --slug "deal-emirates-islamic-emirates-holidays-10000-skywards-miles-17-december" --query "Emirates A380" --orientation landscape --pick 0 --replace --alt "An Emirates Airbus A380 in the airline's livery in flight at sunset"
          npm run fetch:stock -- --slug "deal-emirates-islamic-noon-gift-card-welcome-31-december" --query "delivery parcel boxes doorstep" --orientation landscape --pick 3 --replace --alt "A delivered parcel waiting outside a front door"
          npm run fetch:stock -- --slug "deal-emirates-islamic-sharaf-dg-10pct-8-november" --query "electronics store laptops display" --orientation landscape --pick 2 --replace --alt "A laptop on a desk, for the Sharaf DG electronics offer"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.45 — re-picks for the Emirates Islamic deal photos" \
            -m "Licensed Pexels photographs naming the brands the pages cover."
          git push origin "HEAD:$TARGET_BRANCH"
