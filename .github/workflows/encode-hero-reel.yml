# Rebuild the homepage scroll-reel from the ORIGINAL fal.ai clips.
#
# gen-ai-video.yml keeps only web encodes in the repo; the full-quality
# originals stay on fal.ai's storage. This re-downloads finished requests
# by id (no new generation, no spend), joins them in order and encodes
# the two files the hero plays:
#   hero-journey-scrub.mp4      desktop, native resolution, light compression
#   hero-journey-scrub-720.mp4  phones: a 2:3 portrait crop from the
#                               full-size frames, so a tall screen is not
#                               a 4-5x blow-up of a small landscape copy
# Both keep a keyframe every 6 frames so scroll-scrubbing seeks cleanly.
# With upscale: true each clip is first upscaled to ~4K (Topaz Proteus via
# fal, non-generative), and screens >= 1600 px get a 2560 px encode.
# Added 5 October 2026 after the Chairman flagged the reel as not sharp.

name: encode-hero-reel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to commit to (never main)"
        required: true
        type: string
      request_ids:
        description: "fal.ai request ids, comma-separated, in playing order"
        required: true
        type: string
      model:
        description: "fal.ai model the requests ran on"
        required: false
        default: "fal-ai/kling-video/v2.5-turbo/pro/image-to-video"
        type: string
      crf:
        description: "x264 quality (lower = sharper, larger)"
        required: false
        default: "21"
        type: string
      upscale:
        description: "AI-upscale each clip to ~4K first (Topaz Proteus on fal, ~$0.30 per 5 s clip)"
        required: false
        default: false
        type: boolean
      upscale_ids:
        description: "Recover finished upscale requests instead of paying again (comma-separated, same order)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse main
        if: inputs.branch == 'main'
        run: |
          echo "::error::Dispatch with a feature branch; main only changes via pull request."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          ffmpeg -version | head -1

      - name: Fetch originals
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          IDS: ${{ inputs.request_ids }}
          MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$FAL_KEY" ]; then echo "::error::FAL_KEY secret is not set."; exit 1; fi
          APP=$(echo "$MODEL" | cut -d/ -f1-2)
          mkdir -p /tmp/reel && : > /tmp/reel/list.txt
          i=0
          for id in $(echo "$IDS" | tr ',' ' '); do
            i=$((i+1))
            url=$(curl -fsS -H "Authorization: Key $FAL_KEY" "https://queue.fal.run/$APP/requests/$id" | jq -r '.video.url')
            if [ -z "$url" ] || [ "$url" = "null" ]; then echo "::error::No video for request $id"; exit 1; fi
            curl -fsSL "$url" -o "/tmp/reel/$i.mp4"
            echo "clip $i ($id):"; ffprobe -v error -show_entries stream=width,height,r_frame_rate,bit_rate -show_entries format=duration -of compact "/tmp/reel/$i.mp4"
            echo "file '/tmp/reel/$i.mp4'" >> /tmp/reel/list.txt
          done

      # Topaz Proteus is a classic (non-generative) upscaler: it sharpens
      # what is there and invents nothing, so the frames stay the same
      # pictures. Factor 2.32 takes the 1660 px Kling output just past
      # 3840 px. Each request id is printed so a later failure never
      # costs a second upscale (pass them back as upscale_ids).
      - name: Upscale to 4K
        if: inputs.upscale
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          IDS: ${{ inputs.request_ids }}
          UPSCALE_IDS: ${{ inputs.upscale_ids }}
          MODEL: ${{ inputs.model }}
        run: |
          APP=$(echo "$MODEL" | cut -d/ -f1-2)
          UP="topaz/upscale/video/precision"
          i=0
          set -- $(echo "$UPSCALE_IDS" | tr ',' ' ')
          for id in $(echo "$IDS" | tr ',' ' '); do
            i=$((i+1))
            if [ -n "${1:-}" ]; then
              rid="$1"; shift
              echo "clip $i: recovering upscale $rid (no new spend)"
            else
              src=$(curl -fsS -H "Authorization: Key $FAL_KEY" "https://queue.fal.run/$APP/requests/$id" | jq -r '.video.url')
              rid=$(curl -fsS -X POST -H "Authorization: Key $FAL_KEY" -H "Content-Type: application/json" \
                -d "$(jq -n --arg u "$src" '{video_url:$u, model:"Proteus", upscale_factor:2.32, H264_output:true}')" \
                "https://queue.fal.run/$UP" | jq -r '.request_id')
              echo "clip $i: upscale request $rid  <- keep this id"
              for n in $(seq 1 120); do
                st=$(curl -fsS -H "Authorization: Key $FAL_KEY" "https://queue.fal.run/topaz/upscale/requests/$rid/status" | jq -r '.status')
                [ "$st" = "COMPLETED" ] && break
                sleep 10
              done
              [ "$st" = "COMPLETED" ] || { echo "::error::upscale $rid did not finish (last: $st)"; exit 1; }
            fi
            url=$(curl -fsS -H "Authorization: Key $FAL_KEY" "https://queue.fal.run/topaz/upscale/requests/$rid" | jq -r '.video.url')
            curl -fsSL "$url" -o "/tmp/reel/$i.mp4"
            echo "clip $i upscaled:"; ffprobe -v error -show_entries stream=width,height -of compact "/tmp/reel/$i.mp4"
          done

      - name: Encode
        env:
          CRF: ${{ inputs.crf }}
        run: |
          COMMON="-an -c:v libx264 -preset slow -g 6 -keyint_min 6 -sc_threshold 0 -bf 0 -pix_fmt yuv420p -movflags +faststart"
          # Large screens (>= 1600 px) get 2560 px; laptops 1920 px at most.
          ffmpeg -y -loglevel error -f concat -safe 0 -i /tmp/reel/list.txt -vf "scale='min(1920,iw)':-2" $COMMON -crf "$CRF" public/videos/hero-journey-scrub.mp4
          ffmpeg -y -loglevel error -f concat -safe 0 -i /tmp/reel/list.txt -vf "scale='min(2560,iw)':-2" $COMMON -crf "$CRF" public/videos/hero-journey-scrub-2560.mp4
          # Phones: centre 2:3 crop at full height, then cap at 1080 tall.
          ffmpeg -y -loglevel error -f concat -safe 0 -i /tmp/reel/list.txt \
            -vf "crop=trunc(ih*2/3/2)*2:ih,scale=-2:'min(1440,ih)'" $COMMON -crf "$((CRF + 2))" public/videos/hero-journey-scrub-720.mp4
          for f in public/videos/hero-journey-scrub*.mp4; do
            echo "$f"; ffprobe -v error -show_entries stream=width,height -show_entries format=duration,size -of compact "$f"
          done

      - name: Commit and push
        env:
          BRANCH: ${{ inputs.branch }}
          IDS: ${{ inputs.request_ids }}
          CRF: ${{ inputs.crf }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/hero-journey-scrub*.mp4
          git commit -m "feat(video): re-encode hero reel from fal originals (crf $CRF)" -m "Requests: $IDS"
          git push origin "HEAD:$BRANCH"
