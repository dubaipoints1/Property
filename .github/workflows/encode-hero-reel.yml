# Rebuild the homepage scroll-reel from the ORIGINAL fal.ai clips.
#
# gen-ai-video.yml keeps only web encodes in the repo; the full-quality
# originals stay on fal.ai's storage. This re-downloads finished requests
# by id (no new generation, no spend), joins them in order and encodes
# the two files the hero plays:
#   hero-journey-scrub.mp4      desktop, native resolution, light compression
#   hero-journey-scrub-720.mp4  phones: a 2:3 portrait crop from the
#                               full-size frames, so a tall screen is not
#                               a 4-5x blow-up of a small landscape copy
# Both keep a keyframe every 6 frames so scroll-scrubbing seeks cleanly.
# Added 5 October 2026 after the Chairman flagged the reel as not sharp.

name: encode-hero-reel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to commit to (never main)"
        required: true
        type: string
      request_ids:
        description: "fal.ai request ids, comma-separated, in playing order"
        required: true
        type: string
      model:
        description: "fal.ai model the requests ran on"
        required: false
        default: "fal-ai/kling-video/v2.5-turbo/pro/image-to-video"
        type: string
      crf:
        description: "x264 quality (lower = sharper, larger)"
        required: false
        default: "21"
        type: string

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse main
        if: inputs.branch == 'main'
        run: |
          echo "::error::Dispatch with a feature branch; main only changes via pull request."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          ffmpeg -version | head -1

      - name: Fetch originals
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          IDS: ${{ inputs.request_ids }}
          MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$FAL_KEY" ]; then echo "::error::FAL_KEY secret is not set."; exit 1; fi
          APP=$(echo "$MODEL" | cut -d/ -f1-2)
          mkdir -p /tmp/reel && : > /tmp/reel/list.txt
          i=0
          for id in $(echo "$IDS" | tr ',' ' '); do
            i=$((i+1))
            url=$(curl -fsS -H "Authorization: Key $FAL_KEY" "https://queue.fal.run/$APP/requests/$id" | jq -r '.video.url')
            if [ -z "$url" ] || [ "$url" = "null" ]; then echo "::error::No video for request $id"; exit 1; fi
            curl -fsSL "$url" -o "/tmp/reel/$i.mp4"
            echo "clip $i ($id):"; ffprobe -v error -show_entries stream=width,height,r_frame_rate,bit_rate -show_entries format=duration -of compact "/tmp/reel/$i.mp4"
            echo "file '/tmp/reel/$i.mp4'" >> /tmp/reel/list.txt
          done

      - name: Encode
        env:
          CRF: ${{ inputs.crf }}
        run: |
          COMMON="-an -c:v libx264 -preset slow -g 6 -keyint_min 6 -sc_threshold 0 -bf 0 -pix_fmt yuv420p -movflags +faststart"
          ffmpeg -y -loglevel error -f concat -safe 0 -i /tmp/reel/list.txt $COMMON -crf "$CRF" public/videos/hero-journey-scrub.mp4
          # Phones: centre 2:3 crop at full height, then cap at 1080 tall.
          ffmpeg -y -loglevel error -f concat -safe 0 -i /tmp/reel/list.txt \
            -vf "crop=trunc(ih*2/3/2)*2:ih,scale=-2:'min(1080,ih)'" $COMMON -crf "$((CRF + 2))" public/videos/hero-journey-scrub-720.mp4
          for f in public/videos/hero-journey-scrub*.mp4; do
            echo "$f"; ffprobe -v error -show_entries stream=width,height -show_entries format=duration,size -of compact "$f"
          done

      - name: Commit and push
        env:
          BRANCH: ${{ inputs.branch }}
          IDS: ${{ inputs.request_ids }}
          CRF: ${{ inputs.crf }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/hero-journey-scrub.mp4 public/videos/hero-journey-scrub-720.mp4
          git commit -m "feat(video): re-encode hero reel from fal originals (crf $CRF)" -m "Requests: $IDS"
          git push origin "HEAD:$BRANCH"
