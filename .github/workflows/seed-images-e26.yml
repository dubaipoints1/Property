# Phase E.26 — photos for 23 card-offer deals (ENBD, Mashreq, RAKBANK, DIB,
# Citi, Standard Chartered, HSBC) added 20 October 2026. Unbranded, no
# people, no alcohol, no logos, no airline liveries.
#
# The deals ship with their slugs in ALLOWED_MISSING
# (tests/images/content-coverage.test.ts). The step after the fetch drops
# every exception the manifest now covers, so the stale-entry test passes on
# the seeded commit; a slug Pexels returned nothing for keeps its exception.

name: seed-images-e26

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e26.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Fetch photos (23 card-offer deals)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npm run fetch:stock -- --slug "deal-enbd-tripcom-mastercard-20pct" --query "suitcase passport world map flat lay" --orientation landscape --pick 0 --alt "A suitcase, passport and paper map laid out on a table"
          npm run fetch:stock -- --slug "deal-enbd-zuvees-15pct-flowers" --query "flower bouquet wrapped paper table" --orientation landscape --pick 0 --alt "A wrapped bouquet of fresh flowers on a table"
          npm run fetch:stock -- --slug "deal-enbd-right-bite-20pct-meal-plans" --query "healthy meal prep containers vegetables" --orientation landscape --pick 0 --alt "Prepared healthy meals in containers with fresh vegetables"
          npm run fetch:stock -- --slug "deal-mashreq-cinepolis-50pct-tickets" --query "empty cinema seats red" --orientation landscape --pick 0 --alt "Rows of empty red cinema seats"
          npm run fetch:stock -- --slug "deal-rakbank-talabat-25pct-rak30" --query "takeaway food boxes table top view" --orientation landscape --pick 0 --alt "Takeaway food containers on a table, seen from above"
          npm run fetch:stock -- --slug "deal-rakbank-noon-15pct-rak50" --query "cardboard parcels delivery boxes stack" --orientation landscape --pick 0 --alt "A stack of plain cardboard delivery boxes"
          npm run fetch:stock -- --slug "deal-rakbank-careem-food-25pct-rak25" --query "bowl of noodles chopsticks top view" --orientation landscape --pick 0 --alt "A bowl of noodles with chopsticks, seen from above"
          npm run fetch:stock -- --slug "deal-rakbank-lulu-sundays-15pct" --query "fresh fruit vegetables market display" --orientation landscape --pick 0 --alt "Fresh fruit and vegetables on a market display"
          npm run fetch:stock -- --slug "deal-rakbank-igp-20pct-rak20" --query "wrapped gift box ribbon" --orientation landscape --pick 0 --alt "A gift box wrapped with ribbon"
          npm run fetch:stock -- --slug "deal-dib-air-arabia-20pct-ultimate" --query "airplane window seat clouds view" --orientation landscape --pick 0 --alt "Clouds seen through an aircraft window"
          npm run fetch:stock -- --slug "deal-dib-dr-nutrition-app-dib15" --query "protein powder scoop shaker gym" --orientation landscape --pick 0 --alt "A scoop of protein powder beside a shaker bottle"
          npm run fetch:stock -- --slug "deal-dib-choix-intercontinental-20pct" --query "afternoon tea pastries tiered stand" --orientation landscape --pick 0 --alt "Pastries on a tiered afternoon tea stand"
          npm run fetch:stock -- --slug "deal-dib-mann-marzi-15pct" --query "indian curry dishes table naan" --orientation landscape --pick 0 --alt "Indian curries and naan bread on a table"
          npm run fetch:stock -- --slug "deal-citi-makemytrip-10pct-plus-10pct-wallet" --query "hotel room bed window city view" --orientation landscape --pick 0 --alt "A made hotel bed beside a window with a city view"
          npm run fetch:stock -- --slug "deal-citi-fnp-15pct-citi15" --query "flowers gift box roses" --orientation landscape --pick 0 --alt "Roses arranged in a gift box"
          npm run fetch:stock -- --slug "deal-citi-nrtc-fresh-10pct" --query "crate of fresh vegetables" --orientation landscape --pick 0 --alt "A wooden crate of fresh vegetables"
          npm run fetch:stock -- --slug "deal-citi-reel-cinemas-bogo-ultima-prestige" --query "popcorn cinema screen dark" --orientation landscape --pick 0 --alt "A tub of popcorn in front of a cinema screen"
          npm run fetch:stock -- --slug "deal-citi-styli-20pct" --query "clothes rack hangers neutral" --orientation landscape --pick 0 --alt "Clothes on hangers on a rail"
          npm run fetch:stock -- --slug "deal-citi-dubai-parks-15pct" --query "roller coaster track blue sky" --orientation landscape --pick 0 --alt "A roller coaster track against a blue sky"
          npm run fetch:stock -- --slug "deal-sc-journey-duty-free-10pct-cashback" --query "airport terminal shopping corridor empty" --orientation landscape --pick 0 --alt "An empty shopping corridor in an airport terminal"
          npm run fetch:stock -- --slug "deal-hsbc-careem-plus-12-months-free" --query "city street night car lights" --orientation landscape --pick 0 --alt "Car lights on a city street at night"
          npm run fetch:stock -- --slug "deal-hsbc-zomato-gold-12-months-free" --query "restaurant table set plates empty" --orientation landscape --pick 0 --alt "A restaurant table set with empty plates"
          npm run fetch:stock -- --slug "deal-hsbc-farfetch-visa-26visame" --query "shopping bags plain white background" --orientation landscape --pick 0 --alt "Plain paper shopping bags on a white background"

      - name: Drop ALLOWED_MISSING exceptions the manifest now covers
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("data/stock/manifest.json", "utf8"));
            const entries = Array.isArray(m) ? m : (m.images ?? m.entries);
            const have = new Set(entries.map((e) => e.slug));
            const f = "tests/images/content-coverage.test.ts";
            const out = fs.readFileSync(f, "utf8").split("\n").filter((l) => {
              const hit = l.match(/^\s*"(deal-[^"]+)": "awaiting seed-images-e26",$/);
              return !(hit && have.has(hit[1]));
            });
            fs.writeFileSync(f, out.join("\n"));
          '

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/ tests/images/content-coverage.test.ts
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.26 — photos for 23 card-offer deals" \
            -m "Licensed Pexels photograph, unbranded mood imagery."
          git push origin "HEAD:$TARGET_BRANCH"
