# Primary-source reader. Prints the readable text of up to ten public
# pages or PDFs into this run's log, so a Claude Code web session — whose
# egress allowlist blocks nearly every issuer host — can read a source by
# dispatching this workflow and reading the job log through the GitHub API.
# Costs no Firecrawl credits. See scripts/ci/fetch-sources.mjs.
#
# No repository writes or issues; optional evidence lives only in runner temp
# and an explicitly requested seven-day artifact. The URLs go
# through an environment variable, never interpolated into the script, and
# anything that is not an https URL is refused.

name: fetch-sources

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated https URLs to read (max 10)"
        type: string
        required: true
      archive:
        description: "Optional raw public-source evidence and full extracted text (no site-data writes)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # pdftotext comes from poppler-utils. Runner image 20260927 no longer
      # ships it, and every PDF came back "[pdftotext failed: ENOENT]".
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Read sources
        env:
          SOURCE_URLS: ${{ inputs.urls }}
          SOURCE_ARCHIVE: ${{ inputs.archive && '1' || '0' }}
        run: node scripts/ci/fetch-sources.mjs

      - name: Upload explicitly requested source evidence
        if: ${{ always() && inputs.archive }}
        uses: actions/upload-artifact@v4
        with:
          name: public-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dubaipoints-source-archive/
          retention-days: 7
          if-no-files-found: error
