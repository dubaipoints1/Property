# Phase E.17 — replace the Qatar Privilege Club Sharjah news photo (11 October 2026).
#
# The E.16 pick was a blurred reflection of a terminal with champagne
# bottles on display: weak at tile size and on the imagery kill-list (no
# alcohol). Same query discipline as E.14–E.16; nothing branded.
#
# Push-triggered on claude/** branches (commits back to the same branch),
# dispatchable with a branch input; never runs against main.

name: seed-images-e17

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e17.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Replace the Qatar Sharjah news photo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          slug=news-qatar-privilege-deals-october-sharjah-book-by-14-october
          npm run fetch:stock -- \
            --slug "$slug" \
            --query "airplane taking off runway sunset" \
            --orientation landscape \
            --pick 0 \
            --replace \
            --alt "Passenger jet taking off from a runway at sunset"
          # Old derivatives belong to the old picture; make-thumbs rebuilds them.
          rm -f "public/images/stock/thumb/$slug.webp" "public/images/stock/md/$slug.webp"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.17 — replace the Qatar Sharjah news photo" \
            -m "The E.16 photo was a blurred terminal reflection with champagne bottles on display (alcohol is on the imagery kill-list). Licensed Pexels photograph, unbranded."
          git push origin "HEAD:$TARGET_BRANCH"
