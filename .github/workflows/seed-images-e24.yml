# Phase E.24 — photos for the cashback, Skywards, lounge-access and airport
# lounge guides and three FAB deals. Unbranded, no people.

name: seed-images-e24

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e24.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Fetch photos (new guides and FAB deals)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npm run fetch:stock -- --slug "guide-best-cashback-cards-uae-2026" --query "grocery shopping basket supermarket aisle" --orientation landscape --pick 0 --alt "A shopping basket of groceries in a supermarket aisle"
          npm run fetch:stock -- --slug "guide-best-skywards-cards-uae-2026" --query "airplane wing window clouds sunset" --orientation landscape --pick 0 --alt "View of an aircraft wing above the clouds at sunset"
          npm run fetch:stock -- --slug "guide-best-lounge-access-cards-uae-2026" --query "empty airport lounge seating window" --orientation landscape --pick 0 --alt "Empty airport lounge seating beside a large window"
          npm run fetch:stock -- --slug "guide-uae-airport-lounges-card-access-2026" --query "airport terminal departure hall empty seats" --orientation landscape --pick 0 --alt "Rows of empty seats in a bright airport departure hall"
          npm run fetch:stock -- --slug "deal-fab-amazon-now-weekend-25pct" --query "grocery delivery bags doorstep" --orientation landscape --pick 0 --alt "Paper grocery bags left at an apartment door"
          npm run fetch:stock -- --slug "deal-fab-binsina-3pct-cashback" --query "pharmacy shelves vitamins" --orientation landscape --pick 0 --alt "Shelves of vitamin and wellness products in a pharmacy aisle"
          npm run fetch:stock -- --slug "deal-fab-zed-ride-cashback" --query "car back seat city night lights" --orientation landscape --pick 0 --alt "View from the back seat of a car driving through city lights at night"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.24 — four guides and three FAB deals" \
            -m "Licensed Pexels photograph, unbranded mood imagery."
          git push origin "HEAD:$TARGET_BRANCH"
