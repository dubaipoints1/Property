# Phase E.39 — brand photos for the 1 November 2026 news posts (2026-10-20 real-brands ruling).

name: seed-images-e39

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e39.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Fetch photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npm run fetch:stock -- --slug "news-emirates-skywards-double-miles-hotels-car-rental-accor-bonus-30-november" --query "Emirates airplane" --orientation landscape --pick 0 --alt "An Emirates aircraft in the airline's livery"
          npm run fetch:stock -- --slug "news-emirates-a350-premium-economy-hanoi-ho-chi-minh-city-durban" --query "Emirates Airbus A350" --orientation landscape --pick 1 --alt "An Emirates Airbus A350 in the airline's livery"
          npm run fetch:stock -- --slug "news-all-accor-double-points-uae-hotels-book-by-13-december" --query "Novotel hotel" --orientation landscape --pick 0 --alt "A Novotel hotel, one of the Accor brands in the offer"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.39 — brand photos for the 1 November 2026 news posts" \
            -m "Licensed Pexels photographs of the brands the pages cover."
          git push origin "HEAD:$TARGET_BRANCH"
