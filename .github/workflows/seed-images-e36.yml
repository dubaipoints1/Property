# Phase E.36 — stock photos for the 26 October 2026 deals whose merchants have no logo yet. Generic scenes only: no faces, no alcohol, no brand marks.

name: seed-images-e36

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e36.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Fetch deal photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npm run fetch:stock -- --slug "deal-fab-grandiose-10pct-instore-cashback" --query "supermarket aisle fresh produce shelves" --orientation landscape --pick 0 --alt "Fresh produce on supermarket shelves"
          npm run fetch:stock -- --slug "deal-fab-800carguru-7pct-cashback" --query "car service garage workshop" --orientation landscape --pick 0 --alt "A car raised on a lift in a service workshop"
          npm run fetch:stock -- --slug "deal-enbd-yas-island-parks-30pct" --query "roller coaster theme park ride" --orientation landscape --pick 0 --alt "A roller coaster track against the sky"
          npm run fetch:stock -- --slug "deal-enbd-republiks-gym-20pct" --query "empty gym weights equipment" --orientation landscape --pick 0 --alt "Weights and training equipment in an empty gym"
          npm run fetch:stock -- --slug "deal-enbd-urban-company-noon-5pct" --query "home cleaning supplies tidy living room" --orientation landscape --pick 0 --alt "Cleaning supplies in a tidy living room"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.36 — photos for the 26 October 2026 deals" \
            -m "Licensed Pexels photographs, generic scenes, for deals whose merchants have no logo yet."
          git push origin "HEAD:$TARGET_BRANCH"
