# Phase E.44 — photos for the 3 November 2026 desk run: the flydubai Skopje post and four Emirates Islamic deals.

name: seed-images-e44

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e44.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Fetch photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npm run fetch:stock -- --slug "news-flydubai-dubai-skopje-three-weekly-from-1-april-2027" --query "flydubai airplane" --orientation landscape --pick 3 --alt "A flydubai Boeing 737 in the airline's livery"
          npm run fetch:stock -- --slug "deal-emirates-islamic-noon-gift-card-welcome-31-december" --query "noon shopping" --orientation landscape --pick 0 --alt "Online shopping parcels, for the noon gift card offer"
          npm run fetch:stock -- --slug "deal-emirates-islamic-air-arabia-eib-book-by-15-november" --query "Air Arabia airplane" --orientation landscape --pick 1 --alt "An Air Arabia aircraft in the airline's livery"
          npm run fetch:stock -- --slug "deal-emirates-islamic-emirates-holidays-10000-skywards-miles-17-december" --query "Emirates airplane" --orientation landscape --pick 1 --alt "An Emirates aircraft in the airline's livery"
          npm run fetch:stock -- --slug "deal-emirates-islamic-sharaf-dg-10pct-8-november" --query "Sharaf DG electronics store" --orientation landscape --pick 0 --alt "Televisions and electronics on display, for the Sharaf DG offer"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.44 — photos for the 3 November 2026 news post and Emirates Islamic deals" \
            -m "Licensed Pexels photographs naming the brands the pages cover."
          git push origin "HEAD:$TARGET_BRANCH"
