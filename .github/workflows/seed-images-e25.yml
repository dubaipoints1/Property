# Phase E.25 — replace three E.24 picks: a pharmacist's face and logo, a
# person in a car, branded bottles. Unbranded, no people.

name: seed-images-e25

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to seed (commits land here; never main)"
        required: true
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/seed-images-e25.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then echo "::error::seed against a feature branch"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
      - run: npm ci

      - name: Replace three E.24 picks (face, logo, branded bottles)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          rm -f "public/images/stock/thumb/deal-fab-amazon-now-weekend-25pct.webp" "public/images/stock/md/deal-fab-amazon-now-weekend-25pct.webp"
          npm run fetch:stock -- --slug "deal-fab-amazon-now-weekend-25pct" --query "fresh vegetables fruit paper bag kitchen table" --orientation landscape --pick 0 --replace --alt "Fresh vegetables and fruit in a paper bag on a kitchen table"
          rm -f "public/images/stock/thumb/deal-fab-binsina-3pct-cashback.webp" "public/images/stock/md/deal-fab-binsina-3pct-cashback.webp"
          npm run fetch:stock -- --slug "deal-fab-binsina-3pct-cashback" --query "vitamin capsules pills white background" --orientation landscape --pick 0 --replace --alt "Vitamin capsules and tablets on a plain white surface"
          rm -f "public/images/stock/thumb/deal-fab-zed-ride-cashback.webp" "public/images/stock/md/deal-fab-zed-ride-cashback.webp"
          npm run fetch:stock -- --slug "deal-fab-zed-ride-cashback" --query "city road night light trails long exposure" --orientation landscape --pick 0 --replace --alt "Light trails from traffic on a city road at night"

      - name: Validate
        run: npm run check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Responsive WebP derivatives (640/1200px; 360px for card art) so new images ship fast.
          npm run images:thumbs
          git add data/stock/manifest.json public/images/stock/
          for d in public/images/stock/thumb public/images/stock/md public/images/ai/thumb public/images/ai/md public/images/cards/thumb; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --staged --quiet; then echo "No new images fetched (is PEXELS_API_KEY set?)."; exit 0; fi
          git commit \
            -m "feat(images): Phase E.25 — replace three FAB deal photos" \
            -m "Licensed Pexels photograph, unbranded mood imagery."
          git push origin "HEAD:$TARGET_BRANCH"
